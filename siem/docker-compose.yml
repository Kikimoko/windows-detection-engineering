# Single-node Elasticsearch for local testing (security disabled: LOCAL LAB ONLY, never expose). Painless regex must be enabled for the exported regex rules.
services:
  es:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    environment: [discovery.type=single-node, xpack.security.enabled=false, script.painless.regex.enabled=true, ES_JAVA_OPTS=-Xms2g -Xmx2g]
    ports: ["127.0.0.1:9200:9200"]
