title: Credential dumping command lines (ntdsutil, reg save SAM, shadow copy, comsvcs MiniDump)
id: win_credential_dump_commands
status: experimental
description: Process command lines used to extract NTDS.dit, SAM/SYSTEM hives or LSASS memory.
logsource:
  product: windows
detection:
  selection_ntds:
    CommandLine|contains:
    - ntdsutil
    - ntds.dit
  selection_reg:
    CommandLine|re: (?i)\breg(\.exe)?[\"']?\s+(save|export)\s+\S*hk(lm|ey_local_machine)\\(sam|security|system)\b
  selection_vss:
    CommandLine|contains|all:
    - vssadmin
    - create shadow
  selection_comsvcs:
    CommandLine|contains|all:
    - comsvcs
    - minidump
  selection_sekurlsa:
    CommandLine|contains:
    - sekurlsa
    - 'lsadump::'
    - invoke-mimikatz
  condition: 1 of selection_*
  selection_esentutl:
    CommandLine|contains|all:
    - esentutl
    - /vss
falsepositives:
- Backup administrators using VSS/ntdsutil
level: high
tags:
- attack.credential_access
- attack.t1003.002
- attack.t1003.003
- attack.t1003.001
version: 3
