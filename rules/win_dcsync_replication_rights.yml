title: Directory replication rights used (possible DCSync)
id: win_dcsync_replication_rights
status: experimental
description: Security 4662 Control Access on a directory object by a non-machine account; matches replication GUIDs when the message is rendered, otherwise AccessMask 0x100 on a DS object.
logsource:
  product: windows
detection:
  selection_guid:
    EventID: 4662
    Message|contains:
    - 1131f6aa-9c07-11d1-f79f-00c04fc2dcd2
    - 1131f6ad-9c07-11d1-f79f-00c04fc2dcd2
    - 89e95b76-444d-4c62-991a-0facbeda640c
  selection_control_access:
    EventID: 4662
    AccessMask: '0x100'
    ObjectName|startswith: '%{'
  filter_machine:
    SubjectUserName|endswith: $
  condition: 1 of selection_* and not filter_machine
falsepositives:
- Azure AD Connect sync account
- Other extended-right use by admins (password reset)
level: high
tags:
- attack.credential_access
- attack.t1003.006
version: 2
